spring.application.name=pitchr-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pitchr;WRITE_DELAY=0}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
pitchr.team-email=${TEAM_EMAIL:team.leads@example.com}
pitchr.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
pitchr.cookie-secure=${COOKIE_SECURE:false}
pitchr.session-days=30
