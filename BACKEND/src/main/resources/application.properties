spring.application.name=rizzume-backend
server.port=${PORT:8080}
# Recognize HTTPS forwarded by local reverse proxies such as ngrok.
# Tomcat applies these headers only when the connection comes from a trusted proxy.
server.forward-headers-strategy=native
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pitchr;WRITE_DELAY=0}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
# Packaged resources have reproducible timestamps. Always serve the current
# files rather than validating an older browser copy against the same timestamp.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-store=true
pitchr.team-email=${TEAM_EMAIL:team.leads@example.com}
pitchr.team-inbox-key=${TEAM_INBOX_KEY:}
pitchr.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
pitchr.cookie-secure=${COOKIE_SECURE:false}
pitchr.session-days=30

# Limit individual multipart parts and aggregate requests to the maximum eight 5 MB gallery files.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB
# Account ownership protects profile writes. ADMIN_KEY is optional for trusted server-side maintenance.
pitchr.admin-key=${ADMIN_KEY:}

# Optional TURN relay for calls across restrictive networks. Use short-lived credentials in production.
rizzume.turn-url=${TURN_URL:}
rizzume.turn-user=${TURN_USERNAME:}
rizzume.turn-password=${TURN_PASSWORD:}
