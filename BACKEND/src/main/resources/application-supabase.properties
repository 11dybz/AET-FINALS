# Enable explicitly with --spring.profiles.active=supabase.
# .env uses Java properties syntax and is only read for this profile.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Keep app tables separate from Supabase's public Data API schema.
spring.jpa.properties.hibernate.default_schema=pitchr
spring.flyway.default-schema=pitchr
spring.flyway.schemas=pitchr
spring.flyway.create-schemas=true
